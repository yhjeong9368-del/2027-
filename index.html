<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>협곡 감독 밴픽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  /* 픽창: 남흑색 바탕에 금색 테두리, 진영색(블루·레드)은 팀 표시에만 */
  --bg: #050b14;
  --bg-2: #08121e;
  --panel: #0b1724;
  --panel-2: #11202f;
  --line: #1c3040;
  --line-2: #2b4354;
  --gold: #c8a75e;
  --gold-hi: #f0deae;
  --gold-lo: #6c5830;
  --text: #ece6d6;
  --muted: #8f9aa6;
  --dim: #56636f;
  --blue: #4c8bf0;
  --red: #e9585d;
  --display: "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --us: var(--blue);
  --them: var(--red);
  color-scheme: dark;
  /* 레이아웃: PC는 블루 팀 | 챔피언 그리드 | 레드 팀 3단, 폰은 두 팀을 나란히 두고 그리드를 아래로 */
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background: radial-gradient(90% 55% at 50% -8%, #12253a 0%, rgba(5, 11, 20, 0) 62%), linear-gradient(#060d17, var(--bg) 40%); background-color: var(--bg); background-repeat: no-repeat; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
h1, h2 { text-wrap: balance; }

.app { max-width: 1320px; margin: 0 auto; padding: 10px 14px 0; }

/* 상단 */
.top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .mark { font-family: var(--display); font-weight: 900; font-size: 20px; color: var(--gold-hi); letter-spacing: .02em; }
.brand .sub { font-size: 12px; color: var(--gold); letter-spacing: .3em; }
.top > .ghost { grid-row: 1; grid-column: 2; }
.series { grid-column: 1 / -1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 8px; }
.series .tm { font-family: var(--mono); font-weight: 600; letter-spacing: .04em; }
.series .score { font-family: var(--mono); font-size: 18px; color: var(--gold-hi); }
.series .score i { font-style: normal; color: var(--gold-lo); margin: 0 4px; }
.series .fmt { font-size: 12px; color: var(--muted); }
.ghost { background: transparent; border: 1px solid var(--line-2); border-radius: 2px; padding: 7px 12px; font-size: 13px; color: var(--text); white-space: nowrap; }
.ghost:hover { border-color: var(--gold); color: var(--gold-hi); }
.ghost.sm { padding: 5px 10px; font-size: 12px; }

/* 픽창 틀 */
.stage { margin-top: 10px; border-top: 1px solid var(--gold-lo); }
.banbar { display: grid; grid-template-columns: 1fr minmax(0, 1.6fr) 1fr; align-items: center; gap: 10px; padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
.banner { text-align: center; min-width: 0; }
.banner h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--gold-hi); letter-spacing: .04em; }
.banner .sub { margin: 2px 0 6px; font-size: 14px; min-height: 21px; }
.banner .sub .t-blue { color: var(--blue); }
.banner .sub .t-red { color: var(--red); }
.banner .step { margin-left: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.banner .step b { color: var(--gold-hi); font-size: 15px; }
.dots::after { content: "…"; display: inline-block; margin-left: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.cells { list-style: none; margin: 0 auto; padding: 0; max-width: 420px; height: 18px; display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; align-items: end; }
.cell { height: 100%; background: var(--line-2); opacity: .45; transform-origin: bottom; }
.cell.ban { height: 40%; }
.cell:nth-child(7), .cell:nth-child(13), .cell:nth-child(17) { margin-left: 5px; }
.cell.s-blue { background: var(--blue); }
.cell.s-red { background: var(--red); }
.cell.done { opacity: .85; }
.cell.next { opacity: .25; }
.cell.now { opacity: 1; background: var(--gold-hi); animation: beat 1.1s ease-in-out infinite; box-shadow: 0 0 10px var(--gold); }
@keyframes beat { 50% { transform: scaleY(1.3); } }
.bans { display: flex; gap: 4px; flex-wrap: wrap; }
.bans.right { justify-content: flex-end; }
.ban { position: relative; display: inline-grid; }
.ban .pt { filter: grayscale(1) brightness(.6); }
.ban.on::after { content: ""; position: absolute; left: -2px; right: -2px; top: 50%; height: 2px; background: var(--red); transform: rotate(-42deg); box-shadow: 0 0 4px rgba(0, 0, 0, .8); }

/* 3단 */
.cs { display: grid; gap: 12px 14px; padding-top: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "p p" "l r" "w w" "c c"; }
#sideL { grid-area: l; } #sideR { grid-area: r; } #win { grid-area: w; } #pre { grid-area: p; min-width: 0; } .center { grid-area: c; min-width: 0; }
#pre:empty { display: none; }
.side { min-width: 0; }
.side header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; padding: 0 2px 6px; border-bottom: 2px solid var(--side, var(--line-2)); margin-bottom: 6px; }
#sideR header { justify-content: flex-end; text-align: right; }
.side header.s-blue, .slots.s-blue { --side: var(--blue); }
.side header.s-red, .slots.s-red { --side: var(--red); }
.side header.s-none, .slots.s-none { --side: var(--line-2); }
.tname { font-family: var(--mono); font-weight: 600; font-size: 18px; color: var(--side); letter-spacing: .04em; }
.tfull { font-size: 12px; color: var(--muted); }
.tags { flex-basis: 100%; font-size: 12px; color: var(--muted); }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.slot { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 5px; min-height: 54px;
  background: linear-gradient(90deg, color-mix(in oklab, var(--side) 16%, transparent), transparent 70%); border: 1px solid var(--line); }
#sideR .slot { grid-template-columns: auto minmax(0, 1fr) auto; background: linear-gradient(270deg, color-mix(in oklab, var(--side) 16%, transparent), transparent 70%); }
#sideR .slot .pt { order: 3; }
#sideR .slot .g { order: 1; }
#sideR .slot .who { order: 2; text-align: right; align-items: flex-end; }
.slot.aim { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(200, 167, 94, .35); }
.slot.wait { border-color: color-mix(in oklab, var(--side) 60%, var(--line)); animation: waitp 1.4s ease-in-out infinite; }
@keyframes waitp { 50% { box-shadow: 0 0 12px color-mix(in oklab, var(--side) 45%, transparent); } }
.who { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.who .pl { display: inline-flex; align-items: center; gap: 4px; }
#sideR .who .pl { flex-direction: row-reverse; }
.who .pl b { font-size: 13.5px; font-weight: 700; }
.who .li { width: 14px; height: 14px; color: var(--muted); }
.who .cn { font-family: var(--display); font-weight: 700; font-size: 14px; color: var(--gold-hi); word-break: keep-all; }
.slot:not(.filled) .cn { font-family: var(--body); font-weight: 400; font-size: 12px; color: var(--muted); }

/* 정사각 초상: 주 조합 유형 색의 무늬 + 이름 두 글자 */
.pt { --h: 220; --ang: 135deg; --sz: 64px; position: relative; flex: none; display: block; width: var(--sz); height: var(--sz); overflow: hidden; border: 1px solid var(--gold-lo);
  background:
    radial-gradient(110% 85% at 28% 18%, hsl(var(--h) 60% 42% / .9), transparent 62%),
    repeating-linear-gradient(var(--ang), hsl(var(--h) 45% 30% / .35) 0 5px, transparent 5px 11px),
    linear-gradient(var(--ang), hsl(var(--h) 48% 17%), hsl(calc(var(--h) + 35) 40% 7%)); }
.pt::before { content: ""; position: absolute; inset: 0; z-index: 1; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .55), inset 0 -18px 22px rgba(0, 0, 0, .45); }
/* 초상화: 라이엇 Data Dragon 정사각형 아이콘. 가장자리 테두리를 잘라 내려고 살짝 확대 */
.pt > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); }
.pt.pic::before { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .55), inset 0 -10px 14px rgba(0, 0, 0, .25); }
.pt .mono { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: calc(var(--sz) * .34); line-height: 1; letter-spacing: -.05em; color: #f7efdc;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .7), 0 0 14px hsl(var(--h) 80% 55% / .45); }
.pt .ci { position: absolute; left: 3px; bottom: 3px; width: 13px; height: 13px; fill: none; stroke: var(--gold-hi); stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.pt.lg { --sz: 44px; }
.pt.md { --sz: 44px; }
.pt.sm { --sz: 30px; }
.pt.xs { --sz: 24px; }
.pt.empty { background: repeating-linear-gradient(135deg, rgba(255, 255, 255, .025) 0 4px, transparent 4px 9px), var(--bg-2); border-color: var(--line); }

/* 등급 칩 */
.g { display: inline-grid; place-items: center; min-width: 19px; height: 19px; padding: 0 4px; font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text); background: var(--panel-2); border-radius: 2px; }
.g-S { color: #1c1404; background: linear-gradient(#f4dc9a, #c8a75e); }
.g-A { color: #0f1729; background: #d8e2f2; }
.g-C { color: #ffb48d; background: transparent; box-shadow: inset 0 0 0 1px #6b4636; }
.g-D { color: #ff8f8f; background: transparent; box-shadow: inset 0 0 0 1px #6b3434; }
.g.sig { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--gold-hi); }
.g.vs { color: var(--them); background: rgba(0, 0, 0, .55); box-shadow: inset 0 0 0 1px var(--them); }
.m { font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--muted); }
.m-S { color: var(--gold-hi); }
.m-A { color: var(--text); }

/* 예상 승률 */
.win { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 8px 10px; background: rgba(8, 18, 30, .8); border: 1px solid var(--line); }
.wl { font-size: 12px; color: var(--muted); }
.wn { font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums; }
.wn i { font-style: normal; font-size: 13px; margin-left: 1px; }
.wn.us { color: var(--us); }
.wn.them { color: var(--them); }
.wbar { height: 6px; background: var(--them); overflow: hidden; }
.wbar i { display: block; height: 100%; background: var(--us); transition: width .35s ease; }
.wnote { grid-column: 1 / -1; font-size: 11px; color: var(--dim); }

/* 가운데 */
.choice { padding: 16px; text-align: center; background: linear-gradient(#0f1f2e, #0a1622); border: 1px solid var(--gold); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 10px 30px rgba(0, 0, 0, .45); }
.choice h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold-hi); }
.choice > .muted { margin: 6px auto 0; max-width: 560px; font-size: 13.5px; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 420px; margin-left: auto; margin-right: auto; }
.opt { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 8px; background: linear-gradient(#162a3a, #0d1b28); border: 1px solid var(--line-2); }
.opt b { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--gold-hi); }
.opt small { font-size: 12px; color: var(--muted); }
.opt.o-blue { border-color: color-mix(in oklab, var(--blue) 60%, var(--line-2)); }
.opt.o-blue b { color: #8fb6ff; }
.opt.o-red { border-color: color-mix(in oklab, var(--red) 60%, var(--line-2)); }
.opt.o-red b { color: #ff9a9d; }
.opt:hover { border-color: var(--gold-hi); }
.selline { margin: 0 0 6px; font-size: 12px; color: var(--muted); min-height: 1px; }
.advice { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.advice.wait p { margin: 0; padding: 6px 0; font-size: 13px; color: var(--muted); }
.alabel { font-size: 12px; font-weight: 600; color: var(--gold); display: flex; flex-direction: column; line-height: 1.2; }
.alabel small { font-weight: 400; color: var(--muted); }
.recs { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; }
.rec { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; text-align: left; background: var(--panel); border: 1px solid var(--line-2); flex: 0 0 auto; }
.rec span { display: flex; flex-direction: column; line-height: 1.2; }
.rec b { font-size: 13px; }
.rec small { font-size: 11px; color: var(--muted); }
.rec:hover { border-color: var(--gold); }

.picker { background: rgba(8, 18, 30, .55); border: 1px solid var(--line); }
.filters { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 10px; padding: 6px 8px 0; background: linear-gradient(#0a1622 85%, rgba(10, 22, 34, .9)); border-bottom: 1px solid var(--line); }
.lanes { display: flex; gap: 0; }
.lane-btn { display: grid; justify-items: center; gap: 1px; width: 52px; padding: 4px 0 5px; color: var(--muted); background: transparent; border: 0; border-bottom: 2px solid transparent; }
.lane-btn .li { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.lane-btn .li .map { stroke-width: 1.2; opacity: .4; }
.lane-btn .li .road { stroke-width: 3; }
.lane-btn small { font-size: 10.5px; }
.lane-btn:hover { color: var(--text); }
.lane-btn.on { color: var(--gold-hi); border-bottom-color: var(--gold); }
.lane-btn.done { opacity: .3; cursor: default; }
.who .li, .rc .li { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.who .li .road, .rc .li .road { stroke-width: 3.2; }
.who .li .map, .rc .li .map { opacity: .45; stroke-width: 1.2; }
.search { display: flex; align-items: center; gap: 8px; margin-left: auto; padding-bottom: 6px; flex: 1 1 220px; max-width: 360px; }
.search input { flex: 1; min-width: 110px; padding: 6px 10px; font-size: 13.5px; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 0; }
.search input::placeholder { color: var(--dim); }
.search select { flex: none; width: auto; padding: 6px 4px; font-size: 12.5px; background: var(--bg-2); border: 1px solid var(--line-2); }
.count { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px 6px; padding: 10px 8px 14px; }
.tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; background: none; border: 0; min-width: 0; }
.tile .pt { --sz: 64px; transition: transform .12s ease, border-color .12s ease; }
.tile .tn { max-width: 100%; font-size: 11.5px; line-height: 1.2; text-align: center; color: var(--text); word-break: keep-all; }
.tile .m { position: absolute; top: 2px; left: calc(50% - 30px); z-index: 1; text-shadow: 0 1px 2px #000; }
.tile .g { position: absolute; top: 2px; right: calc(50% - 31px); z-index: 1; }
.tile .state { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); z-index: 1; padding: 0 5px; font-family: var(--mono); font-size: 10.5px; color: var(--text); background: rgba(0, 0, 0, .7); }
.tile:hover:not(.off) .pt { transform: translateY(-2px); border-color: var(--gold); }
.tile.off .pt { filter: grayscale(1) brightness(.4); }
.tile.off .tn { color: var(--dim); }
.tile.banned .pt::after { content: ""; position: absolute; z-index: 2; left: -10%; right: -10%; top: 50%; height: 2px; background: var(--red); transform: rotate(-42deg); }
.tile.locked .pt { border-style: dashed; }
.tile.norole { opacity: .5; }
.tile.sel .pt { border-color: var(--gold-hi); box-shadow: 0 0 0 2px var(--gold), 0 0 18px rgba(240, 222, 174, .5); }
.tile.sel .tn { color: var(--gold-hi); }
.empty-note { grid-column: 1 / -1; font-size: 13px; }

/* 확정 */
.lockbar { position: sticky; bottom: 0; z-index: 20; margin-top: 10px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(5, 11, 20, .85), #050b14 35%); border-top: 1px solid var(--gold-lo); }
.lockbar[hidden] { display: none; }
.lk { display: flex; align-items: center; gap: 10px; }
.lkinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.3; }
.lkinfo b { font-size: 14px; color: var(--gold-hi); }
.lkinfo small { font-size: 11.5px; color: var(--muted); }
.rolesw { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.rc { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px 1px 4px; font-size: 12px; background: transparent; border: 1px solid var(--line-2); }
.rc .li { width: 14px; height: 14px; }
.rc.on { color: var(--gold-hi); border-color: var(--gold); }
.lockbtn { min-width: 132px; padding: 11px 20px; font-family: var(--display); font-weight: 700; font-size: 16px; letter-spacing: .12em; color: var(--gold-hi);
  background: linear-gradient(#1c3140, #0d1b26); border: 2px solid var(--gold); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .7); }
.lockbtn:disabled { color: var(--dim); border-color: var(--line-2); cursor: default; }
.lockbtn.ready { animation: glow 1.8s ease-in-out infinite; }
.lockbtn.ban { border-color: var(--red); color: #ffd0d1; }
.lockbtn.wide { display: block; width: 100%; margin-top: 14px; }
.lockbtn:not(:disabled):hover { filter: brightness(1.15); }
@keyframes glow { 50% { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .7), 0 0 18px rgba(240, 222, 174, .45); } }

/* 분석·결과 */
.card { padding: 16px; background: linear-gradient(#0d1b29, #0a1520); border: 1px solid var(--gold-lo); }
.chead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold-hi); }
.bignum { display: flex; align-items: center; gap: 12px; margin: 8px 0 12px; }
.bignum b { font-family: var(--display); font-weight: 900; font-size: 54px; line-height: .95; color: var(--us); font-variant-numeric: tabular-nums; }
.bignum b i { font-style: normal; font-size: 24px; }
.bignum span { font-size: 13px; color: var(--muted); line-height: 1.4; }
.bd { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.bd li { display: grid; grid-template-columns: 74px minmax(0, 1fr) 50px; align-items: center; gap: 8px; font-size: 13px; }
.dv { position: relative; height: 8px; background: var(--panel-2); }
.dv::after { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--gold-lo); }
.dv i { position: absolute; top: 0; bottom: 0; }
.dv i.pos { left: 50%; background: var(--us); }
.dv i.neg { right: 50%; background: var(--them); }
.bv { font-family: var(--mono); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.comps p { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 6px; margin: 10px 0 0; font-size: 13.5px; }
.comps .who { display: inline; padding: 0 8px; font-size: 12px; color: var(--us); border: 1px solid var(--us); }
.comps .who.them { color: var(--them); border-color: var(--them); }
b.a-dive { color: hsl(22 85% 66%); }
b.a-protect { color: hsl(174 60% 58%); }
b.a-poke { color: hsl(262 80% 76%); }
b.a-pick { color: hsl(330 80% 74%); }
b.a-split { color: hsl(88 65% 60%); }
.flags { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.flag { padding: 0 6px; font-size: 11.5px; color: #ffb48d; border: 1px solid #6b4636; }
.comps .counter { color: var(--muted); font-size: 13px; }
.comps .combo { display: flex; gap: 6px; align-items: baseline; font-size: 13px; }
.comps .combo .cbl { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.comps .combo .cb { white-space: nowrap; }
.comps .combo .cb small { color: var(--muted); }
.comps .combo .cb b { font-weight: 600; }
.rhead { display: flex; align-items: center; gap: 14px; }
.rt { font-family: var(--display); font-weight: 900; font-size: 48px; line-height: 1; letter-spacing: .06em; }
.won .rt { color: var(--gold-hi); text-shadow: 0 0 22px rgba(240, 222, 174, .35); }
.lost .rt { color: var(--them); }
.rhead span { font-size: 14px; line-height: 1.4; }
.rhead small { color: var(--muted); font-size: 12px; }
.rstats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 10px; }
.rstats div { padding: 8px 4px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); }
.rstats dt { font-size: 11px; color: var(--muted); }
.rstats dd { margin: 0; font-family: var(--mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.gold { display: block; width: 100%; height: auto; margin-top: 4px; }
.ga.us { fill: color-mix(in oklab, var(--us) 34%, transparent); }
.ga.them { fill: color-mix(in oklab, var(--them) 34%, transparent); }
.g0 { stroke: var(--gold-lo); stroke-width: 1; stroke-dasharray: 3 3; }
.gl { fill: none; stroke: var(--gold-hi); stroke-width: 1.6; stroke-linejoin: round; }
.events { list-style: none; margin: 12px 0 0; padding: 0; max-height: 300px; overflow-y: auto; display: grid; gap: 3px; }
.ev { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 8px; padding: 4px 8px; font-size: 13px; background: var(--bg-2); border-left: 3px solid var(--them); }
.ev.us { border-left-color: var(--us); }
.ev .et { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.sfin { margin-top: 16px; }
.sfin small { display: block; margin-top: 4px; font-size: 13px; color: var(--gold-hi); }
.krow .kr { grid-column: 4; grid-row: 1 / span 2; font-family: var(--mono); font-size: 12px; min-width: 28px; text-align: right; color: var(--muted); }
.krow .kr.hi { color: var(--gold-hi); font-weight: 600; } .krow .kr.lo { color: #ff7a6b; }
.krow.pog .kn { color: var(--gold-hi); }
.pogb { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em; margin-left: 5px; padding: 0 4px; color: #0a1520; background: var(--gold); border-radius: 2px; }
.srt { font-family: var(--mono); font-size: 12px; color: var(--gold); min-width: 26px; text-align: right; }
.sn-rate h3 { font-size: 13px; color: var(--gold); margin: 12px 0 6px; }
.rl { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
.rl li { display: flex; align-items: center; gap: 6px; font-size: 14px; } .rl li.me b { color: var(--gold-hi); }
.rl small { color: var(--muted); font-size: 12px; } .rl .srt { margin-left: auto; }
.sfin b { font-family: var(--display); font-weight: 900; font-size: 26px; }
.sfin.w b { color: var(--gold-hi); }
.sfin.l b { color: var(--them); }
.games { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.games li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.gn { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.gr { font-weight: 700; }
.gr.w { color: var(--gold-hi); }
.gr.l { color: var(--them); }
.gp { display: inline-flex; gap: 2px; }
.vs { font-size: 11px; color: var(--muted); }

/* 새 시리즈 시트 */
.sheet { position: fixed; inset: 0; z-index: 50; display: grid; place-items: end center; padding: 12px; background: rgba(2, 5, 10, .74); }
.sheet[hidden] { display: none; }
.sheet-card { width: min(560px, 100%); max-height: calc(100% - 12px); overflow-y: auto; padding: 18px 16px 16px; background: linear-gradient(#0f1f2e, #0a1622); border: 1px solid var(--gold); }
.sheet-card h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--gold-hi); }
.field { margin: 14px 0 0; padding: 0; border: 0; min-width: 0; }
.field > label, .field > legend { display: block; margin-bottom: 6px; padding: 0; font-size: 13px; color: var(--muted); }
select { width: 100%; padding: 9px; font-size: 14px; background: var(--bg-2); border: 1px solid var(--line-2); }
.segs { display: flex; flex-wrap: wrap; gap: 6px; }
.sg { position: relative; }
.sg input { position: absolute; opacity: 0; pointer-events: none; }
.sg span { display: inline-block; padding: 7px 13px; font-size: 13px; border: 1px solid var(--line-2); cursor: pointer; }
.sg input:checked + span { color: var(--gold-hi); border-color: var(--gold); background: rgba(200, 167, 94, .12); font-weight: 600; }
.sg input:focus-visible + span { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
.field.check { display: flex; align-items: flex-start; gap: 8px; }
.field.check input { margin-top: 4px; width: 16px; height: 16px; accent-color: var(--gold); }
.field.check label { margin: 0; color: var(--text); font-size: 13.5px; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.sheet-actions .lockbtn { min-width: 0; font-size: 14px; letter-spacing: .04em; padding: 9px 16px; }
.err { color: #ff8f8f; font-size: 13px; margin: 10px 0 0; }
.flash { position: fixed; left: 50%; bottom: 96px; z-index: 60; transform: translateX(-50%); max-width: calc(100% - 32px); padding: 8px 14px; font-size: 13px; background: var(--panel-2); border: 1px solid var(--gold-lo); }
.flash[hidden] { display: none; }
/* ---------- 경기 방향성 ---------- */
.planbox { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.planbox h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--gold-hi); }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 10px 0 12px; }
.plan { display: grid; gap: 4px; padding: 10px; text-align: left; color: var(--text); background: var(--bg-2); border: 1px solid var(--line-2); cursor: pointer; min-height: 44px; }
.plan b { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; }
.plan small { font-size: 12px; line-height: 1.45; color: var(--muted); }
.plan:hover { border-color: var(--gold-lo); }
.plan.on { border-color: var(--gold); background: rgba(200, 167, 94, .12); box-shadow: inset 0 0 0 1px var(--gold); }
.pfit { padding: 1px 6px; font-size: 11px; font-weight: 600; color: #0b1622; background: var(--gold); }

/* ---------- 실시간 경기 ---------- */
.banner.live h1 .clock { font-family: var(--mono); font-weight: 600; letter-spacing: .02em; }
.banner.live .sub { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; gap: 4px 10px; font-size: 14px; }
.banner.live .sub b { font-family: var(--mono); font-size: 16px; }
.banner.live .stat { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kda { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--gold-hi); white-space: nowrap; font-variant-numeric: tabular-nums; }
#sideR .slot .kda { order: 1; }
.slot.dead .pt { filter: grayscale(1) brightness(.45); }
.slot.dead .who b { color: var(--dim); }
.live { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.mmwrap { min-width: 0; }
.mm { position: relative; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 1; overflow: hidden; border: 1px solid var(--gold-lo); background: #0a1a14; }
.mm-map { position: absolute; inset: 0; width: 100%; height: 100%; }
.mm-ground { fill: #0d2219; }
.mm-jg { fill: #0a1a12; }
.mm-river { fill: none; stroke: #16384a; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.mm-lane { fill: none; stroke: #6f6650; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.mm-base.b { fill: color-mix(in oklab, var(--blue) 26%, transparent); }
.mm-base.r { fill: color-mix(in oklab, var(--red) 26%, transparent); }
.mm-pit { fill: none; stroke-width: .9; }
.mm-pit.baron { stroke: #a77bd6; }
.mm-pit.dragon { stroke: #e0904a; }
.tw, .ih, .nx { stroke: #050b14; stroke-width: .5; }
.tw.s-blue, .ih.s-blue, .nx.s-blue { fill: var(--blue); }
.tw.s-red, .ih.s-red, .nx.s-red { fill: var(--red); }
.tw.down, .ih.down { fill: #2a3440; stroke: #55606e; }
.tok { position: absolute; z-index: 2; width: 8.5%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; overflow: hidden; border: 2px solid var(--blue); box-shadow: 0 1px 4px rgba(0, 0, 0, .6); transition: left .75s ease, top .75s ease, filter .3s; }
.tok.s-red { border-color: var(--red); }
.tok.dead { filter: grayscale(1) brightness(.5); opacity: .7; }
.tok .pt { width: 100%; height: 100%; border: 0; border-radius: 50%; }
.tok .pt .mono { font-size: 10px; letter-spacing: -.04em; }
#mm-fx { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.kx { position: absolute; width: 5%; aspect-ratio: 1; transform: translate(-50%, -50%); animation: kxfade 1.8s ease-out forwards; }
.kx svg { width: 100%; height: 100%; fill: none; stroke-width: 2.4; stroke-linecap: round; }
.kx.s-blue svg { stroke: #8fb8ff; } .kx.s-red svg { stroke: #ff9a9e; }
.px { position: absolute; width: 9%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid var(--gold-hi); animation: pxring 1.6s ease-out forwards; }
.px.s-blue { border-color: var(--blue); } .px.s-red { border-color: var(--red); }
@keyframes kxfade { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1); } }
@keyframes pxring { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.3); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } }
.mmctl { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
.mmctl .spd.on { color: var(--gold-hi); border-color: var(--gold); }
.liveside { display: grid; gap: 10px; align-content: start; min-width: 0; }
.call { padding: 14px; background: linear-gradient(#13263a, #0c1824); border: 1px solid var(--gold); box-shadow: 0 0 0 1px rgba(0, 0, 0, .6), 0 0 22px rgba(200, 167, 94, .18); }
.call h3 { margin: 0 0 4px; font-family: var(--display); font-weight: 700; font-size: 17px; color: var(--gold-hi); }
.call .opts { margin-top: 10px; }
.call .opt.rec-opt { box-shadow: inset 0 0 0 1px var(--gold-lo); }
.call.wait { border-color: var(--line-2); box-shadow: none; }
.plansline { margin: 0; font-size: 12.5px; color: var(--muted); }
.plansline .t-blue { color: var(--blue); font-weight: 600; } .plansline .t-red { color: var(--red); font-weight: 600; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.ev.nt { border-left-color: var(--line-2); color: var(--muted); }
.ev.k-skirmish, .ev.k-tower { font-size: 12.5px; }
.kdat { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0 10px; }
.kcol { padding: 8px; background: var(--panel-2); border: 1px solid var(--line); border-top: 2px solid var(--blue); }
.kcol.s-red { border-top-color: var(--red); }
.kt { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 4px; font-size: 13px; }
.kt small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.krow { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto auto; gap: 2px 6px; align-items: center; padding: 3px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.krow .li { width: 14px; height: 14px; }
.krow .kn { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.krow .kc { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.krow .kv { grid-column: 3; grid-row: 1 / span 2; font-family: var(--mono); font-weight: 600; color: var(--gold-hi); font-variant-numeric: tabular-nums; }
.callsum { list-style: none; margin: 0 0 10px; padding: 8px 10px; font-size: 12.5px; background: var(--bg-2); border: 1px solid var(--line); display: grid; gap: 3px; }
.callsum .et { font-family: var(--mono); color: var(--muted); }
.stage[data-phase="live"] .cs { grid-template-areas: "c c" "l r" "w w"; }
/* 대전 상태 줄 (온라인 방·한 폰 2인) */
.netbar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; padding: 8px 12px; font-size: 13px; line-height: 1.45; background: var(--bg-2); border: 1px solid var(--line-2); }
.netbar[hidden] { display: none; }
.netbar .nb-msg { flex: 1; min-width: 0; }
.netbar .nb-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.netbar.ok .nb-dot { background: #4fd18b; box-shadow: 0 0 8px rgba(79, 209, 139, .8); }
.netbar.wait { border-color: var(--gold-lo); }
.netbar.wait .nb-dot, .netbar.warn .nb-dot { background: var(--gold); animation: nbblink 1.2s ease-in-out infinite; }
.netbar.bad { border-color: #7a3a3a; color: #ffb4b4; }
.netbar.bad .nb-dot { background: var(--red); }
.netbar .code { font-family: var(--mono); font-size: 15px; letter-spacing: .14em; color: var(--gold-hi); }
@keyframes nbblink { 50% { opacity: .3; } }
.sheet-card[data-vs="local"] .only-ai, .sheet-card[data-vs="online"] .only-ai { display: none; }
.sheet-card:not([data-vs="online"]) .only-online { display: none; }
.joinbox { margin: 14px 0 0; padding: 12px; border: 1px dashed var(--gold-lo); }
.joinbox > label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
.joinbox .muted { margin: 8px 0 0; }
.joinrow { display: flex; gap: 8px; }
.joinrow input { flex: 1; min-width: 0; padding: 8px 10px; font: 600 18px/1.2 var(--mono); letter-spacing: .25em; text-transform: uppercase; color: var(--text); background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 0; }
.lockbtn.sm-btn { min-width: 0; padding: 8px 14px; font-size: 14px; letter-spacing: .04em; }
.center-note { margin: 12px 0 0; text-align: center; }
.foot { margin: 18px 0 10px; font-size: 11.5px; line-height: 1.6; color: var(--dim); text-align: center; }
.pics-note { color: var(--muted); }

/* 잠길 때 */
.slot.pop .pt, .ban.pop .pt { animation: lockin .55s cubic-bezier(.2, .8, .2, 1); }
@keyframes lockin { 0% { transform: scale(.5); filter: brightness(2.2); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }

@media (max-width: 560px) {
  .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kdat { gap: 6px; }
  .krow { font-size: 12px; }
  .banbar { grid-template-columns: 1fr 1fr; }
  .banner { grid-column: 1 / -1; order: -1; }
  .banner h1 { font-size: 19px; }
  .slot { gap: 6px; padding: 4px; min-height: 48px; }
  .pt.lg { --sz: 38px; }
  .who .pl b { font-size: 12.5px; }
  .who .cn { font-size: 13px; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 9px 4px; padding: 8px 4px 12px; }
  .tile .pt { --sz: 58px; }
  .tile .m { left: calc(50% - 27px); }
  .tile .g { right: calc(50% - 28px); }
  .lane-btn { width: 46px; }
  .search { max-width: none; }
  .lockbtn { min-width: 96px; padding: 10px 14px; }
}
@media (min-width: 1000px) {
  .app { padding: 14px 22px 0; }
  .cs { grid-template-columns: minmax(230px, 280px) minmax(0, 1fr) minmax(230px, 280px); grid-template-areas: "l p r" "l c r" "w w w"; grid-template-rows: auto 1fr auto; }
  .stage[data-phase="live"] .cs { grid-template-areas: "l c r" "l c r" "w w w"; }
  .live { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  #pre:empty { display: block; }
  .slots { gap: 6px; }
  .slot { min-height: 72px; padding: 6px; }
  .pt.lg { --sz: 58px; }
  .who .cn { font-size: 16px; }
  .grid { max-height: 470px; overflow-y: auto; }
  .stage[data-phase="review"] .grid, .stage[data-phase="result"] .grid { max-height: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* 컨디션·교체·상대 분석 */
.cnd { font-style: normal; font-family: var(--mono); font-size: 11px; font-weight: 600; margin-left: 5px; padding: 0 4px; border: 1px solid currentColor; border-radius: 2px; line-height: 1.4; }
.cnd.c-up { color: #5ccf8f; } .cnd.c-mid { color: var(--muted); } .cnd.c-down { color: #ff7a6b; }
.lineup { text-align: left; margin-bottom: 10px; }
.lineup .subs { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
.lineup .subs li { display: flex; align-items: center; gap: 8px; }
.lineup .sw { flex: 1; font-size: 13px; } .lineup .sw em { font-style: normal; color: var(--gold); margin: 0 6px; }
.subnote { font-size: 12px; color: var(--gold-hi); margin: 0 0 10px; }
.scout { border: 1px solid var(--line); background: var(--panel); margin-bottom: 10px; }
.scout-h { width: 100%; display: flex; gap: 8px; align-items: baseline; padding: 10px 12px; background: none; border: 0; color: var(--text); text-align: left; }
.scout-h i { margin-left: auto; font-style: normal; font-size: 12px; color: var(--gold); }
.scl { list-style: none; margin: 0; padding: 0 12px 6px; display: grid; gap: 6px; }
.scl li { display: grid; grid-template-columns: 110px 1fr; gap: 8px; align-items: center; font-size: 12px; }
.scl .sp { display: flex; align-items: center; gap: 4px; }
.scs { display: flex; flex-wrap: wrap; gap: 6px; }
.sc { display: inline-flex; align-items: center; gap: 4px; } .sc small { color: var(--muted); margin-left: 3px; } .sc.off { opacity: .35; }
.scl .tg { font-size: 10px; color: var(--muted); border: 1px solid var(--line); padding: 0 3px; margin-left: 4px; } .scl .tg.ti { color: var(--gold); border-color: var(--gold-lo); }
.scout > p { padding: 0 12px 10px; margin: 0; }
.cline { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin: 10px 0; }
/* 시즌 */
.season { display: grid; gap: 12px; padding: 12px; max-width: 760px; margin: 0 auto; }
.season h2 { font-family: var(--display); font-size: 18px; margin: 0 0 8px; }
.sn-now .big { font-family: var(--display); font-size: 26px; color: var(--gold-hi); margin: 4px 0; }
.sn-now .vsline { display: flex; gap: 12px; align-items: baseline; font-family: var(--display); font-size: 24px; margin: 4px 0; }
.sn-now .vsline span { font-size: 14px; color: var(--muted); }
.sq, .sn-recent ul, .mlist, .mdone { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sq li { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.sq li.sub { opacity: .8; } .sq small { color: var(--muted); }
.sq .ov, .mlist .ov { font-family: var(--mono); color: var(--gold-hi); margin-left: auto; }
.sq .tc, .mlist .tc { font-size: 12px; color: var(--muted); min-width: 110px; text-align: right; }
.sn-table table { width: 100%; border-collapse: collapse; font-size: 14px; }
.sn-table th, .sn-table td { padding: 5px 6px; text-align: left; border-bottom: 1px solid var(--line); }
.sn-table td:nth-child(n+3), .sn-table th:nth-child(n+3) { text-align: right; font-family: var(--mono); }
.sn-table tr.me td { color: var(--gold-hi); font-weight: 600; }
.sn-table tr.cut td { border-bottom: 1px solid var(--gold-lo); }
.brs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.br h3 { font-size: 13px; color: var(--gold); margin: 0 0 4px; } .br p { margin: 2px 0; font-size: 14px; } .br .me, .sn-recent li.me { color: var(--gold-hi); font-weight: 600; }
.sn-recent li { font-size: 14px; }
.mtabs { display: flex; gap: 4px; margin: 8px 0; }
.mtabs button { flex: 1; padding: 7px 0; background: transparent; border: 1px solid var(--line); color: var(--muted); }
.mtabs button.on { border-color: var(--gold); color: var(--gold-hi); }
.mine { font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
